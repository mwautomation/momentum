[project]
name = "library-api"
version = "1.0.0"
description = "API for managing a library's book inventory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.4",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: tests that require PostgreSQL",
]
